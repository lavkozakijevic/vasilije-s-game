<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"><script src="sheet.js"></script></head><body><div class="row" style="align-items:flex-end;gap:30px"><div class="cell"><div style="width:96px;height:96px;background:url(../../assets/tilesets/forest/tileset_forest.png) 0 0/768px 672px;image-rendering:pixelated;box-shadow:0 0 0 3px var(--eh-ink)"></div><span class="lab"><b>tile</b> 32×32 @3x</span></div><div class="cell"><div class="well" style="padding:0"><div data-strip="../../assets/sprites/heroes/fire/hero_fire_idle.png" data-frames="4" data-fps="6"></div></div><span class="lab"><b>frame</b> 32×32 @3x</span></div><div class="cell"><div style="display:grid;grid-template-columns:repeat(3,48px);gap:3px"><div style="background:var(--eh-slate);font-family:var(--font-ui);font-size:10px;padding:6px;height:27px;box-shadow:0 0 0 3px var(--eh-ink)">1x 640×360</div><div style="background:var(--eh-slate);font-family:var(--font-ui);font-size:10px;padding:6px;height:27px;box-shadow:0 0 0 3px var(--eh-ink)">2x 1280×720</div><div style="background:var(--eh-slate);font-family:var(--font-ui);font-size:10px;padding:6px;height:27px;box-shadow:0 0 0 3px var(--eh-ink)">3x 1920×1080</div></div><span class="lab"><b>view</b> integer scales only</span></div></div></body></html>
